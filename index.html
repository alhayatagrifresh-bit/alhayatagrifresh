    function App() {
      const [userRole, setUserRole] = useState('grower');
      const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
      const [isAdminLoginModalOpen, setIsAdminLoginModalOpen] = useState(false);

      // Admin Auth
      const [adminUsername, setAdminUsername] = useState('');
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('notices');

      // Primary Data States
      const [notices, setNotices] = useState(INITIAL_NOTICES);
      const [schedules, setSchedules] = useState(INITIAL_GRADING_SCHEDULES);
      const [growers, setGrowers] = useState(INITIAL_GROWERS);

      // Filters
      const [noticeSearch, setNoticeSearch] = useState('');
      const [noticeCategory, setNoticeCategory] = useState('All');
      const [scheduleFilter, setScheduleFilter] = useState('All');
      const [growerSearch, setGrowerSearch] = useState('');

      // Modals
      const [noticeModal, setNoticeModal] = useState({ open: false, mode: 'add', data: null });
      const [turnModal, setTurnModal] = useState({ open: false, mode: 'add', data: null });
      const [growerModal, setGrowerModal] = useState({ open: false, mode: 'add', data: null });

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminUsername === 'ALHAYT' && adminPassword === 'ALHAYT') {
          setIsAdminLoggedIn(true);
          setUserRole('admin');
          setIsAdminLoginModalOpen(false);
          setLoginError('');
          setAdminUsername('');
          setAdminPassword('');
        } else {
          setLoginError('Invalid Username or Password. Use ALHAYT / ALHAYT');
        }
      };

      const handleRoleSwitch = (role) => {
        if (role === 'admin') {
          if (!isAdminLoggedIn) {
            setLoginError('');
            setIsAdminLoginModalOpen(true);
          } else {
            setUserRole('admin');
          }
        } else {
          setUserRole('grower');
        }
      };

      const handleAdminLogout = () => {
        setIsAdminLoggedIn(false);
        setUserRole('grower');
      };

      // CRUD Operations
      const handleSaveNotice = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const noticeData = {
          title: formData.get('title'),
          category: formData.get('category'),
          urgency: formData.get('urgency'),
          content: formData.get('content'),
          pinned: formData.get('pinned') === 'on'
        };

        if (noticeModal.mode === 'add') {
          const newNotice = {
            ...noticeData,
            id: `NOT-2026-00${notices.length + 1}`,
            date: new Date().toISOString().split('T')[0],
            author: 'Facility Admin'
          };
          setNotices([newNotice, ...notices]);
        } else {
          setNotices(notices.map((n) => (n.id === noticeModal.data.id ? { ...n, ...noticeData } : n)));
        }
        setNoticeModal({ open: false, mode: 'add', data: null });
      };

      const handleDeleteNotice = (id) => {
        if (window.confirm('Delete this advisory notice?')) {
          setNotices(notices.filter((n) => n.id !== id));
        }
      };

      const handleSaveTurn = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const turnData = {
          growerName: formData.get('growerName'),
          growerId: formData.get('growerId'),
          cratesCount: parseInt(formData.get('cratesCount') || 0, 10),
          crateType: formData.get('crateType'),
          varieties: formData.get('varieties'),
          date: formData.get('date'),
          shiftTime: formData.get('shiftTime'),
          chamber: formData.get('chamber'),
          status: formData.get('status')
        };

        if (turnModal.mode === 'add') {
          const newTurn = {
            ...turnData,
            id: `TURN-${100 + schedules.length + 1}`,
            lineSpeed: '130 Crates / Hour',
            estCompletion: 'Scheduled'
          };
          setSchedules([newTurn, ...schedules]);
        } else {
          setSchedules(schedules.map((s) => (s.id === turnModal.data.id ? { ...s, ...turnData } : s)));
        }
        setTurnModal({ open: false, mode: 'add', data: null });
      };

      const handleDeleteTurn = (id) => {
        if (window.confirm('Delete this turn schedule?')) {
          setSchedules(schedules.filter((s) => s.id !== id));
        }
      };

      const handleSaveGrower = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const growerData = {
          name: formData.get('name'),
          village: formData.get('village'),
          phone: formData.get('phone'),
          lotAllocated: formData.get('lotAllocated'),
          status: formData.get('status')
        };

        if (growerModal.mode === 'add') {
          const newGrower = {
            ...growerData,
            id: `GRW-PLW-${Math.floor(100 + Math.random() * 900)}`
          };
          setGrowers([newGrower, ...growers]);
        } else {
          setGrowers(growers.map((g) => (g.id === growerModal.data.id ? { ...g, ...growerData } : g)));
        }
        setGrowerModal({ open: false, mode: 'add', data: null });
      };

      const handleDeleteGrower = (id) => {
        if (window.confirm('Delete this grower record?')) {
          setGrowers(growers.filter((g) => g.id !== id));
        }
      };

      // Filtered lists
      const filteredNotices = useMemo(() => {
        return notices.filter((n) => {
          const matchesSearch =
            n.title.toLowerCase().includes(noticeSearch.toLowerCase()) ||
            n.content.toLowerCase().includes(noticeSearch.toLowerCase());
          const matchesCategory = noticeCategory === 'All' || n.category === noticeCategory;
          return matchesSearch && matchesCategory;
        });
      }, [notices, noticeSearch, noticeCategory]);

      const filteredSchedules = useMemo(() => {
        return schedules.filter((s) => {
          if (scheduleFilter === 'Active Today') return s.status === 'In Progress' || s.status === 'Next in Line';
          if (scheduleFilter === 'Upcoming') return s.status === 'Scheduled';
          if (scheduleFilter === 'Completed') return s.status === 'Completed';
          return true;
        });
      }, [schedules, scheduleFilter]);

      const filteredGrowers = useMemo(() => {
        return growers.filter((g) =>
          g.name.toLowerCase().includes(growerSearch.toLowerCase()) ||
          g.id.toLowerCase().includes(growerSearch.toLowerCase()) ||
          g.village.toLowerCase().includes(growerSearch.toLowerCase())

                      onChange={(e) => setAdminPassword(e.target.value)}
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:outline-none"
                    />
                  </div>

                  <div className="pt-2 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setIsAdminLoginModalOpen(false)}
                      className="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-semibold shadow-sm"
                    >
                      Authenticate
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* NOTICE MODAL */}
          {noticeModal.open && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div className="bg-emerald-950 px-6 py-4 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <PlusCircle className="w-5 h-5 text-emerald-400" />
                    {noticeModal.mode === 'add' ? 'Post New Advisory' : 'Edit Advisory Notice'}
                  </h3>
                  <button onClick={() => setNoticeModal({ open: false, mode: 'add', data: null })} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveNotice} className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Advisory Title</label>
                    <input
                      type="text"
                      name="title"
                      required
                      defaultValue={noticeModal.data?.title || ''}
                      placeholder="Title"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Category</label>
                      <select
                        name="category"
                        defaultValue={noticeModal.data?.category || 'Operations'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="Operations">Operations</option>
                        <option value="Grading Mandate">Grading Mandate</option>
                        <option value="Logistics">Logistics</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Urgency</label>
                      <select
                        name="urgency"
                        defaultValue={noticeModal.data?.urgency || 'General'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="General">General</option>
                        <option value="Important">Important</option>
                        <option value="Urgent">Urgent</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Notice Text</label>
                    <textarea
                      name="content"
                      rows="4"
                      required
                      defaultValue={noticeModal.data?.content || ''}
                      placeholder="Notice message"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600"
                    ></textarea>
                  </div>

                  <div className="flex items-center gap-2">
                    <input
                      type="checkbox"
                      id="pinNotice"
                      name="pinned"
                      defaultChecked={noticeModal.data?.pinned || false}
                      className="rounded text-emerald-600"
                    />
                    <label htmlFor="pinNotice" className="text-slate-700 font-medium cursor-pointer">
                      Pin to top of Bulletin Board
                    </label>
                  </div>

                  <div className="pt-3 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setNoticeModal({ open: false, mode: 'add', data: null })}
                      className="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-semibold shadow-sm"
                    >
                      Save Notice
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* TURN MODAL */}
          {turnModal.open && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div className="bg-emerald-950 px-6 py-4 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <Calendar className="w-5 h-5 text-emerald-400" />
                    {turnModal.mode === 'add' ? 'Schedule Grower Grading Turn' : 'Edit Grading Turn'}
                  </h3>
                  <button onClick={() => setTurnModal({ open: false, mode: 'add', data: null })} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveTurn} className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Grower Full Name</label>
                    <input
                      type="text"
                      name="growerName"
                      required
                      defaultValue={turnModal.data?.growerName || ''}
                      placeholder="e.g. Shabir Ahmad Malik"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Grower ID / Lot</label>
                      <input
                        type="text"
                        name="growerId"
                        required
                        defaultValue={turnModal.data?.growerId || ''}
                        placeholder="GRW-PLW-330"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Number of Crates</label>
                      <input
                        type="number"
                        name="cratesCount"
                        required
                        defaultValue={turnModal.data?.cratesCount || ''}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Crate Type</label>
                      <select
                        name="crateType"
                        defaultValue={turnModal.data?.crateType || 'Wooden Crates'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="Wooden Crates">Wooden Crates</option>
                        <option value="Plastic Bins (ISO)">Plastic Bins (ISO)</option>
                      </select>
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Queue Status</label>
                      <select
                        name="status"
                        defaultValue={turnModal.data?.status || 'Scheduled'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="Scheduled">Scheduled</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Next in Line">Next in Line</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Shift Date</label>
                      <input
                        type="date"
                        name="date"
                        required
                        defaultValue={turnModal.data?.date || new Date().toISOString().split('T')[0]}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Shift Window</label>
                      <select
                        name="shiftTime"
                        defaultValue={turnModal.data?.shiftTime || '09:00 AM - 01:00 PM'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="09:00 AM - 01:00 PM">09:00 AM - 01:00 PM</option>
                        <option value="01:30 PM - 05:30 PM">01:30 PM - 05:30 PM</option>
                        <option value="06:00 PM - 10:00 PM">06:00 PM - 10:00 PM</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Apple Varieties</label>
                      <input
                        type="text"
                        name="varieties"
                        required
                        defaultValue={turnModal.data?.varieties || ''}
                        placeholder="Red Delicious (70%), Kullu (30%)"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Chamber</label>
                      <input
                        type="text"
                        name="chamber"
                        required
                        defaultValue={turnModal.data?.chamber || 'CA Chamber 01'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>
                  </div>

                  <div className="pt-3 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setTurnModal({ open: false, mode: 'add', data: null })}
                      className="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-semibold shadow-sm"
                    >
                      Save Turn
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* GROWER MODAL */}
          {growerModal.open && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl border border-slate-100 overflow-hidden">
                <div className="bg-emerald-950 px-6 py-4 text-white flex justify-between items-center">
                  <h3 className="font-bold text-base flex items-center gap-2">
                    <Users className="w-5 h-5 text-emerald-400" />
                    {growerModal.mode === 'add' ? 'Register New Grower' : 'Edit Grower Details'}
                  </h3>
                  <button onClick={() => setGrowerModal({ open: false, mode: 'add', data: null })} className="text-slate-400 hover:text-white">
                    <X className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleSaveGrower} className="p-6 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 mb-1">Grower Full Name</label>
                    <input
                      type="text"
                      name="name"
                      required
                      defaultValue={growerModal.data?.name || ''}
                      placeholder="e.g. Ghulam Hassan Bhat"
                      className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Village / Location</label>
                      <input
                        type="text"
                        name="village"
                        required
                        defaultValue={growerModal.data?.village || ''}
                        placeholder="Petipora, Pulwama"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Mobile Contact</label>
                      <input
                        type="text"
                        name="phone"
                        required
                        defaultValue={growerModal.data?.phone || ''}
                        placeholder="+91 94190XXXXX"
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Allocated CA Lot ID</label>
                      <input
                        type="text"
                        name="lotAllocated"
                        required
                        defaultValue={growerModal.data?.lotAllocated || 'LOT-A100'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono"
                      />
                    </div>

                    <div>
                      <label className="block font-semibold text-slate-700 mb-1">Status</label>
                      <select
                        name="status"
                        defaultValue={growerModal.data?.status || 'Active'}
                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg"
                      >
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 flex gap-3">
                    <button
                      type="button"
                      onClick={() => setGrowerModal({ open: false, mode: 'add', data: null })}
                      className="w-1/2 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg font-semibold shadow-sm"
                    >
                      Save Grower Record
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="bg-slate-900 text-slate-400 py-8 border-t border-slate-800 text-xs">
            <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="flex items-center gap-3">
                <AlHayatLogo className="w-10 h-12" />
                <div>
                  <span className="font-bold text-white text-sm">Al Hayat Agri Fresh</span>
                  <p className="text-[11px] text-slate-400">Petipora, Lassipora Industrial Complex, Pulwama, Kashmir - 192301</p>
                  <p className="text-[11px] text-emerald-400 font-mono mt-0.5">Email: ALHAYATAGRIFRESH@GMAIL.COM</p>
                </div>
              </div>

              <div className="text-center md:text-right text-[11px] text-slate-500 space-y-1">
                <div className="text-slate-300 font-semibold">Executive Contact Lines:</div>
                <div>MD Jahangeer Ah: +91 9906855578 | Mr Ishfaq Ah: +91 7006614320 | Mr Aamir Nazir: +91 7006752565</div>
                <div className="text-slate-600 pt-1">© 2026 Al Hayat Agri Fresh. All rights reserved.</div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
